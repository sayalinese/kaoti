<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>导入题库 · 考题</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23141413'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23FAF9F5' font-family='serif'%3E考%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/">
        <span class="brand-seal">考</span>
        <span class="brand-text">
          <strong>考题</strong>
          <span>本地题库</span>
        </span>
      </a>
      <nav class="nav">
        <a href="/" class="active">题库</a>
        <a href="favorites.html">收藏</a>
        <a href="settings.html">设置</a>
      </nav>
      <span class="topbar-spacer"></span>
      <a class="btn btn-outline btn-sm topbar-action" href="/">返回题库</a>
    </div>
  </header>

  <main class="import-page">
    <header class="import-head">
      <p class="eyebrow">Import / 录入</p>
      <h1>导入题库</h1>
      <p>上传 Word、PDF 或图片，解析出的题目会先进入核对页。科目和考题就是存储层级，可以按文档标题自动建议，也可以自己改。</p>
    </header>

    <section class="import-panel">
      <span class="step-index">STEP 01</span>
      <h2>选择文件与层级</h2>
      <p>Word 使用文档解析，PDF 提取文字层，图片使用 OCR。文档里的 <code># 科目</code>、<code>## 考题</code> 或标题样式会被识别为建议层级。</p>

      <label class="dropzone" id="dropzone">
        <input type="file" id="file" accept=".docx,.pdf,.png,.jpg,.jpeg,.webp,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/pdf,image/*" hidden>
        <strong id="file-label">选择 Word、PDF 或图片</strong>
        <span>也可以把文件拖到这里</span>
      </label>

      <div class="import-fields">
        <div class="field">
          <label for="subject">科目</label>
          <input type="text" id="subject" placeholder="例如：老年人能力评估师" autocomplete="off">
        </div>
        <div class="field">
          <label for="paper">考题</label>
          <input type="text" id="paper" placeholder="例如：2025 年理论复习题库" autocomplete="off">
        </div>
      </div>
      <p class="hint">科目下可以有多个考题；同名考题不会被重复导入。</p>

      <div class="import-actions">
        <button type="button" class="btn btn-primary" id="parse">解析文件</button>
        <span class="editor-status" id="parse-status"></span>
      </div>
    </section>

    <section class="import-preview" id="preview-section" hidden>
      <div class="preview-title-row">
        <div>
          <span class="step-index">STEP 02</span>
          <h2>核对题目</h2>
        </div>
        <span class="result-meta" id="source-name"></span>
      </div>

      <div class="import-stats">
        <div class="import-stat">
          <strong id="stat-total">0</strong>
          <span>识别题目</span>
        </div>
        <div class="import-stat">
          <strong id="stat-ready">0</strong>
          <span>可直接练习</span>
        </div>
        <div class="import-stat is-warn">
          <strong id="stat-review">0</strong>
          <span>待核对</span>
        </div>
        <div class="import-stat">
          <strong id="stat-duplicates">0</strong>
          <span>合并重复</span>
        </div>
      </div>

      <p class="import-notes" id="import-notes"></p>

      <div class="preview-toolbar">
        <label class="check">
          <input type="checkbox" id="select-all" checked> 全选
        </label>
        <label class="check">
          <input type="checkbox" id="only-review"> 只看待核对
        </label>
        <span class="result-meta" id="preview-meta"></span>
      </div>

      <div id="preview-list"></div>

      <div class="commit-bar">
        <span class="commit-summary" id="commit-summary">已选 0 道</span>
        <span class="editor-status commit-status" id="commit-status"></span>
        <button type="button" class="btn btn-primary" id="commit" disabled>导入到题库</button>
      </div>
    </section>
  </main>

  <div id="editor-host"></div>

  <script src="shared.js"></script>
  <script src="import.js"></script>
</body>
</html>
